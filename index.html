<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Spinner</title>
        <style>
            *{
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }
            body {
                background-color: darkorange;
                height: 100vh;
                width: 100vw;
                display: grid;
                place-content: center;
            }

            div {
                background-color:white;
                padding: 50px;
                width: 350px;
                text-align: center;
                border-radius: 20px;
            }
            @keyframes rotate {
                0%{
                    transform: rotate(0deg);
                }
                100%{
                    transform: rotate(360deg);
                }
            }
            img{
                width: 250px;
                margin-bottom: 50px;
            }

            .active {
                animation: rotate 0.2s linear infinite;
            }
            button {
                padding: 15px;
                width: 60%;
                background-color:orange;
                font-size: 20px;
                cursor: pointer;
            }

        </style>
    </head>
    <body>
        <div>
            <img id="spinner" src="Chakra.png" alt="chakra">
            <br>

            <!-- ✅ FIXED ID -->
            <audio id="spinsound" src="spin.mp3"></audio>

            <button id="btn" onclick="control()">START</button>

            <script>
                let spinner = document.getElementById('spinner');
                let btn = document.getElementById('btn');

                // ✅ FIXED ID SAME AS HTML
                let sound = document.getElementById('spinsound');

                let status = false;

                function control () {
                    if(status == false){
                        spinner.classList.add('active');

                        sound.loop = true; // 🔁 loop first
                        sound.play(); // 🔊 play

                        status = true;
                        btn.innerHTML = "STOP";
                    }
                    else {
                        spinner.classList.remove('active');

                        sound.pause(); // ⏸ stop
                        sound.currentTime = 0; // reset

                        status = false;
                        btn.innerHTML = "START";
                    }
                }
            </script>
        </div>
    </body>
      </html>
